<pf-workout-header (createClick)="handleCreate()" />

<main class="pf-page">
    @if (workouts().length === 0) {
        <section class="empty">
            <div class="empty__figure">
                <img [src]="emptyStateImage" alt="Create a new workout" (error)="handleImageError($event)" />
            </div>
            <h2 class="empty__title">Create your first custom workout</h2>
            <p class="empty__subtitle">Set up your own unique routine</p>
            <button type="button" class="btn btn-primary empty__cta" (click)="handleCreate()">
                <span class="empty__cta-icon" aria-hidden="true">+</span>
                <span>START</span>
            </button>
        </section>
    } @else {
        <article class="card" *ngFor="let w of workouts()">
            <header class="card__head">
                <div>
                    <h2>{{ w.name }}</h2>
                    <p>{{ w.exerciseCount }} exercises</p>
                </div>
                <img [src]="w.image || placeholderImage" [alt]="w.name" (error)="handleImageError($event)" />
            </header>

            <ul class="card__list">
                @for (e of w.exercises; track e.name) {
                    <li>
                        <span>{{ e.name }} · {{ e.equipment }}</span>
                        <span>{{ e.sets }} × {{ e.rep }}</span>
                    </li>
                }
            </ul>

            <a class="card__view pf-link" href="#">View all</a>
        </article>
    }
</main>
