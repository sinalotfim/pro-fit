<pf-workout-header (createClick)="handleCreate()" />

<main class="pf-page">
    @if (workouts().length === 0) {
        <pf-workout-empty (createClick)="handleCreate()" />
    } @else {
        <article class="card" *ngFor="let w of workouts()">
            <header class="card__head">
                <div>
                    <h2>{{ w.name }}</h2>
                    <p>{{ w.exerciseCount }} exercises</p>
                </div>
                <img [src]="w.image || placeholderImage" [alt]="w.name" (error)="handleImageError($event)" />
            </header>

            <ul class="card__list">
                @for (e of w.exercises; track e.name) {
                    <li>
                        <span>{{ e.name }} · {{ e.equipment }}</span>
                        <span>{{ e.sets }} × {{ e.rep }}</span>
                    </li>
                }
            </ul>

            <a class="card__view pf-link" href="#">View all</a>
        </article>
    }
</main>
