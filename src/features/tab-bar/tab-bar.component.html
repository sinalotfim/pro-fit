<ion-tabs>
    <ion-tab-bar slot="bottom" class="tab-bar">
        <ion-tab-button tab="workout" href="/tabs/workout">
            <i-lucide [img]="icons.workout" class="tab-bar__icon" />
            <span class="tab-bar__label">Workouts</span>
        </ion-tab-button>

        <ion-tab-button tab="exercise" href="/tabs/exercise">
            <i-lucide [img]="icons.exercise" class="tab-bar__icon" />
            <span class="tab-bar__label">Exercises</span>
        </ion-tab-button>

        <ion-tab-button tab="statistic" href="/tabs/statistic">
            <i-lucide [img]="icons.statistic" class="tab-bar__icon" />
            <span class="tab-bar__label">Statistics</span>
        </ion-tab-button>

        <ion-tab-button tab="profile" href="/tabs/profile">
            <i-lucide [img]="icons.profile" class="tab-bar__icon" />
            <span class="tab-bar__label">Profile</span>
        </ion-tab-button>
    </ion-tab-bar>
</ion-tabs>
