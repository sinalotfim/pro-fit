<pf-exercise-header
    [searchActive]="searchActive()"
    [query]="query()"
    [hasActiveFilter]="hasActiveFilter()"
    [filterOpen]="filterOpen()"
    [count]="count()"
    [activeFilterChips]="activeFilterChips()"
    (searchOpen)="openSearch()"
    (searchClose)="closeSearch()"
    (queryInput)="onQueryInput($event)"
    (filterClick)="openFilter()"
    (clearFilters)="clearAllFilters()"
    (removeChip)="removeFilterChip($event)"
/>

<main class="pf-page">
    <cdk-virtual-scroll-viewport
        class="exercise-viewport"
        [itemSize]="88"
        minBufferPx="240"
        maxBufferPx="480"
        (scrolledIndexChange)="onScrolledIndexChange($event)"
    >
        <div
            *cdkVirtualFor="let row of rows(); trackBy: trackByRow"
            class="row"
            [class.row--header]="row.kind === 'header'"
        >
            @if (row.kind === 'header') {
                <h2 class="row-header">{{ row.letter }}</h2>
            }
            @if (row.kind === 'item') {
                <pf-exercise-item [exercise]="row.exercise" [nameParts]="splitForHighlight(row.exercise.name)" />
            }
        </div>
    </cdk-virtual-scroll-viewport>

    @if (rows().length === 0) {
        <p class="exercise-empty">
            {{ searchActive() ? 'No exercises match your search.' : 'No exercises match your filters.' }}
        </p>
    }
</main>

@if (filterOpen()) {
    <pf-exercise-filter
        [initial]="filterState()"
        [allExercises]="all()"
        (change)="onFilterChange($event)"
        (close)="closeFilter()"
    />
}
